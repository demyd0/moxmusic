<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>mox music — Music Discovery Platform</title>

    <!-- Apply the saved/system theme before first paint, so there's no
         flash of the wrong theme while React boots. Kept in sync going
         forward by useTheme.ts (src/hooks/useTheme.ts). -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('moxmusic_theme');
          if (stored === 'winamp') {
            document.documentElement.classList.add('winamp');
          } else if (stored === 'aero') {
            document.documentElement.classList.add('aero');
          } else {
            var isDark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (isDark) document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>

    <!-- PWA & Mobile Icons -->
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="mox music" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Fonts from moxmap.garden design system -->
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700,900&f[]=cabinet-grotesk@800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-[#fafafa] text-[#0a0a0a] antialiased selection:bg-black selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
